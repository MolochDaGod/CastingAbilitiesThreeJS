<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Grudge Warlords · Casting</title>
    <meta name="description" content="Warlords casting combat — Toon RTS play kit, path cast, DRC skills. Player frontend for grudge6 heroes." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://assets.grudge-studio.com" crossorigin />
    <link rel="preconnect" href="https://open.grudge-studio.com" crossorigin />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__sigil">
          <span class="sigil sigil--fire"></span>
          <span class="sigil sigil--water"></span>
          <span class="sigil sigil--earth"></span>
          <span class="sigil sigil--air"></span>
        </div>
        <h1 class="loader__title">Grudge Warlords</h1>
        <p class="loader__sub" style="margin:0.35rem 0 0;opacity:0.75;font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase">Casting</p>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">Loading Toon RTS play kit…</p>
      </div>
    </div>

    <!-- Heads-up display (populated by src/ui/HUD.js) -->
    <div id="hud" class="hud" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
